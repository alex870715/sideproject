# Portfolio 靜態首頁 → GitHub Pages
# 首次使用前：Repo Settings → Pages → Source 選「GitHub Actions」（或已由 gh 指令啟用）

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject app URLs for GitHub Pages links
        env:
          APPS_ORIGIN: ${{ secrets.APPS_ORIGIN }}
          URL_STOCKORACLE: ${{ secrets.URL_STOCKORACLE }}
          URL_CHOWIT: ${{ secrets.URL_CHOWIT }}
          URL_PLANT: ${{ secrets.URL_PLANT }}
          URL_EARTHONLINE: ${{ secrets.URL_EARTHONLINE }}
        run: |
          inject() { var="$1"; val="$2"; [ -n "$val" ] && sed -i "s|$var|$val|g" portfolio/config.js; }
          inject "__APPS_ORIGIN__" "$APPS_ORIGIN"
          inject "__URL_STOCKORACLE__" "$URL_STOCKORACLE"
          inject "__URL_CHOWIT__" "$URL_CHOWIT"
          inject "__URL_PLANT__" "$URL_PLANT"
          inject "__URL_EARTHONLINE__" "$URL_EARTHONLINE"
          echo "URL injection done (unset secrets keep placeholders)."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
