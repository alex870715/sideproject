# Portfolio 靜態首頁 → GitHub Pages
# 首次使用前：Repo Settings → Pages → Source 選「GitHub Actions」（或已由 gh 指令啟用）

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Render gateway URL for GitHub Pages links
        env:
          APPS_ORIGIN: ${{ secrets.APPS_ORIGIN }}
        run: |
          if [ -n "$APPS_ORIGIN" ]; then
            sed -i "s|__APPS_ORIGIN__|${APPS_ORIGIN}|g" portfolio/config.js
            echo "APPS_ORIGIN injected."
          else
            echo "APPS_ORIGIN secret not set — app links disabled on GitHub Pages. See LINKS.md"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
