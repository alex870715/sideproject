<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Side projects portfolio — Chow-It, Earth Online, PlanT, StockOracle" />
    <title>Portfolio · Side Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="wrap">
      <header class="hero" id="hero"></header>

      <p class="section-label">Projects</p>
      <div class="grid" id="projects"></div>

      <footer>
        <span id="footer-text"></span>
      </footer>
    </div>

    <script src="config.js"></script>
    <script>
      (function () {
        var cfg = window.PORTFOLIO;
        if (!cfg) return;

        if (cfg.setupRequired) {
          var banner = document.createElement("div");
          banner.className = "setup-banner";
          banner.innerHTML =
            "<strong>App 連結尚未設定。</strong> 請先在 Render 佈署全站，再於 GitHub repo 設定 Secret <code>APPS_ORIGIN</code>（你的 gateway 網址），或編輯 <code>portfolio/config.js</code>。詳見 repo 的 <code>LINKS.md</code>。";
          document.querySelector(".wrap").insertBefore(banner, document.getElementById("projects"));
        }

        var hero = document.getElementById("hero");
        hero.innerHTML =
          '<p class="hero-kicker">Portfolio</p>' +
          "<h1>" +
          escapeHtml(cfg.owner.name) +
          "</h1>" +
          '<p class="hero-tagline">' +
          escapeHtml(cfg.owner.tagline) +
          "</p>" +
          '<p class="hero-bio">' +
          escapeHtml(cfg.owner.bio) +
          "</p>" +
          '<div class="hero-links">' +
          (cfg.owner.github
            ? '<a href="' +
              escapeAttr(cfg.owner.github) +
              '" target="_blank" rel="noopener noreferrer">GitHub ↗</a>'
            : "") +
          "</div>";

        var grid = document.getElementById("projects");
        cfg.projects.forEach(function (p) {
          var enabled = p.enabled && p.href && p.href !== "#";
          var el = document.createElement(enabled ? "a" : "article");
          el.className = "card" + (enabled ? "" : " card--disabled");
          if (enabled) {
            el.href = p.href;
            var sameOrigin =
              !p.href.startsWith("http") ||
              p.href.indexOf(location.origin) === 0;
            el.target = sameOrigin ? "_self" : "_blank";
            el.rel = "noopener noreferrer";
          }

          var stackHtml = (p.stack || [])
            .map(function (s) {
              return "<span>" + escapeHtml(s) + "</span>";
            })
            .join("");

          el.innerHTML =
            '<div class="card-head">' +
            '<div style="display:flex;gap:0.75rem;align-items:flex-start">' +
            '<div class="card-accent" style="background:' +
            escapeAttr(p.accent || "#888") +
            '"></div>' +
            "<div>" +
            "<h2 class=\"card-title\">" +
            escapeHtml(p.name) +
            "</h2>" +
            (p.subtitle
              ? '<p class="card-subtitle">' + escapeHtml(p.subtitle) + "</p>"
              : "") +
            "</div></div>" +
            (p.tag ? '<span class="card-tag">' + escapeHtml(p.tag) + "</span>" : "") +
            "</div>" +
            '<p class="card-desc">' +
            escapeHtml(p.description) +
            "</p>" +
            '<div class="stack">' +
            stackHtml +
            "</div>" +
            '<div class="card-foot">' +
            (p.note ? '<span class="card-note">' + escapeHtml(p.note) + "</span>" : "<span></span>") +
            (enabled
              ? '<span class="btn btn--primary" style="background:' +
                escapeAttr(p.accent) +
                '">' +
                escapeHtml(p.hrefLabel || "進入") +
                " →</span>"
              : '<span class="btn btn--ghost">' +
                escapeHtml(p.hrefLabel || "即將上線") +
                "</span>") +
            "</div>";

          grid.appendChild(el);
        });

        document.getElementById("footer-text").textContent =
          "© " + new Date().getFullYear() + " " + cfg.owner.name;

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function escapeAttr(s) {
          return escapeHtml(s).replace(/'/g, "&#39;");
        }
      })();
    </script>
  </body>
</html>
