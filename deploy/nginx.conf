server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    # Portfolio 首頁
    location / {
        root /usr/share/nginx/html/portfolio;
        try_files $uri $uri/ /index.html;
    }

    # Chow-It（Expo static web）
    location /chow-it/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /chow-it/index.html;
    }

    # Earth Online（Expo static web）
    location /earth-online/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /earth-online/index.html;
    }

    # PlanT（Next.js）
    location /plant/ {
        proxy_pass http://plant:3000/plant/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # StockOracle（Streamlit + WebSocket）
    location /stockoracle/ {
        proxy_pass http://stockoracle:8501/stockoracle/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
